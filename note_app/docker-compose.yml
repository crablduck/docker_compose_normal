version: '3.8'

services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - affine_data:/app/data
      - affine_config:/app/config
      - affine_storage:/app/storage
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://affine:affine123456@postgres:5432/affine
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PORT=6379
      - AFFINE_AUTO_MIGRATE=true
      - PRISMA_MIGRATE_DEPLOY=true
      - AFFINE_INIT_DB=true
    depends_on:
      - postgres
      - redis
    networks:
      - affine-network

  postgres:
    image: postgres:15-alpine
    container_name: affine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: affine
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: affine123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - affine-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affine"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: affine-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - affine-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  affine_data:
  affine_config:
  affine_storage:
  postgres_data:
  redis_data:

networks:
  affine-network:
    driver: bridge