version: '3.9'

services:
  crab-mysql:
    image: mysql:8.0
    container_name: crab-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: go_chat
      MYSQL_ROOT_HOST: '%'
      MYSQL_USER: crab
      MYSQL_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql

  crab-redis:
    image: redis:7.0
    container_name: crab-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  crab-minio:
    image: minio/minio:latest
    container_name: crab-minio
    restart: always
    ports:
      - "9000:9000"         # MinIO S3 API
      - "9001:9001"         # MinIO 控制台 UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    restart: always
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_HOST:-kafka}:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@${KAFKA_HOST:-kafka}:9093
      - KAFKA_KRAFT_CLUSTER_ID=kYydZq1wR7aZGr4H7FDv5w
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - ./data:/bitnami/kafka
volumes:
  mysql_data:
  redis_data:
  minio_data:
